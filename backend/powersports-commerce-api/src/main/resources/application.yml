spring:
  application:
    name: powersports-commerce-api

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  session:
    redis:
      namespace: powersports:session
      flush-mode: on_save

server:
  port: 8080

  servlet:
    session:
      timeout: 7d

      cookie:
        name: POWERSPORTS_SESSION
        path: /
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

woocommerce:
  base-url: http://localhost:8085
  webhook-secret: ${WOOCOMMERCE_WEBHOOK_SECRET}
  consumer-key: ${WOOCOMMERCE_CONSUMER_KEY}
  consumer-secret: ${WOOCOMMERCE_CONSUMER_SECRET}

app:
  cors:
    allowed-origin-patterns: ${FRONTEND_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}

torgsoft:
  enabled: ${TORGSOFT_ENABLED:false}
  exchange-directory: ${TORGSOFT_EXCHANGE_DIRECTORY:./data/torgsoft}
  catalog-file-name: ${TORGSOFT_CATALOG_FILE_NAME:TSGoods.trs}
  order-format: ${TORGSOFT_ORDER_FORMAT:JSON}
  product-status: ${TORGSOFT_PRODUCT_STATUS:draft}

  smoke-test:
    enabled: ${TORGSOFT_SMOKE_TEST_ENABLED:false}

  import-on-startup:
    enabled: ${TORGSOFT_IMPORT_ON_STARTUP_ENABLED:false}

  manual-import:
    enabled: ${TORGSOFT_MANUAL_IMPORT_ENABLED:false}
    token: ${TORGSOFT_MANUAL_IMPORT_TOKEN:}

  scheduler:
    enabled: ${TORGSOFT_SCHEDULER_ENABLED:false}
    fixed-delay: ${TORGSOFT_SCHEDULER_FIXED_DELAY:PT15M}
    initial-delay: ${TORGSOFT_SCHEDULER_INITIAL_DELAY:PT1M}

  order-export:
    enabled: ${TORGSOFT_ORDER_EXPORT_ENABLED:false}
    outgoing-directory: ${TORGSOFT_ORDER_EXPORT_DIRECTORY:orders/outgoing}
    file-prefix: ${TORGSOFT_ORDER_FILE_PREFIX:order-}

  worker:
    batch-size: ${TORGSOFT_ORDER_EXPORT_BATCH_SIZE:20}
    max-attempts: ${TORGSOFT_ORDER_EXPORT_MAX_ATTEMPTS:5}
    retry-delay: ${TORGSOFT_ORDER_EXPORT_RETRY_DELAY:PT5M}
    fixed-delay: ${TORGSOFT_ORDER_EXPORT_FIXED_DELAY:PT30S}
    initial-delay: ${TORGSOFT_ORDER_EXPORT_INITIAL_DELAY:PT10S}

  catalog:
    charset: ${TORGSOFT_CATALOG_CHARSET:windows-1251}
    delimiter: "${TORGSOFT_CATALOG_DELIMITER:;}"
    columns:
      good-id: ${TORGSOFT_COLUMN_GOOD_ID:GoodID}
      sku: ${TORGSOFT_COLUMN_SKU:Articul}
      name: ${TORGSOFT_COLUMN_NAME:Name}
      price: ${TORGSOFT_COLUMN_PRICE:Price}
      stock: ${TORGSOFT_COLUMN_STOCK:Quantity}